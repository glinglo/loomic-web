<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDF2F2"/>
      <stop offset="100%" style="stop-color:#FEFCE8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EC6161"/>
      <stop offset="100%" style="stop-color:#e5d36e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>

  <!-- Chart mockup -->
  <rect x="100" y="200" width="1000" height="300" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Bars -->
  <rect x="180" y="280" width="60" height="180" rx="4" fill="url(#accent)" opacity="0.3"/>
  <rect x="280" y="240" width="60" height="220" rx="4" fill="url(#accent)" opacity="0.5"/>
  <rect x="380" y="320" width="60" height="140" rx="4" fill="url(#accent)" opacity="0.4"/>
  <rect x="480" y="260" width="60" height="200" rx="4" fill="url(#accent)" opacity="0.6"/>
  <rect x="580" y="300" width="60" height="160" rx="4" fill="url(#accent)" opacity="0.5"/>
  <rect x="680" y="250" width="60" height="210" rx="4" fill="url(#accent)" opacity="0.7"/>
  <rect x="780" y="340" width="60" height="120" rx="4" fill="url(#accent)" opacity="0.4"/>
  <rect x="880" y="270" width="60" height="190" rx="4" fill="url(#accent)" opacity="0.8"/>
  <rect x="980" y="310" width="60" height="150" rx="4" fill="url(#accent)" opacity="0.6"/>

  <!-- Title -->
  <text x="600" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#111827" text-anchor="middle">Calculate Reorder Intervals</text>
  <text x="600" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#6B7280" text-anchor="middle">Data-driven customer retention</text>
</svg>
